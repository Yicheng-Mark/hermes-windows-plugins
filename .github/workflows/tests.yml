name: tests

# Every plugin here is Windows-only, and each one's suite is self-contained: it needs pytest
# and nothing else. The live tests gate themselves on the API being present, so a runner
# without an Event Log or a WSL distro skips them instead of failing.
on:
  push:
  pull_request:

jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        plugin:
          - windows-ops
          - wslc-sandbox
          - wsl-terminal
          - wincred
          - dpapi-secrets
          - windows-eventlog
          - windows-ports
          - windows-process
          - windows-tasks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "pytest>=8,<10"
      - working-directory: ${{ matrix.plugin }}
        run: python -m pytest tests -q
