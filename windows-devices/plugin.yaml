name: hermes-windows-devices
version: 0.1.0
manifest_version: 2
description: "Answer 'which device on this Windows machine is unhappy, and what does it need' on Windows: lists every present PnP device with its class (System, Net, HIDClass, Display), its status and its problem code in words (28 is one with no driver installed, 10 one that cannot start, 22 one the person disabled, 43 one Windows stopped after it reported a failure); details one device with the driver behind it - version, date, signer, INF - or the absence of one, its manufacturer, its hardware ids, and whether the driver is signed. Read-only: CIM is queried, nothing is enabled, disabled, updated or reinstalled; no network, no file writes. Windows only."
author: Yicheng-Mark
kind: general
license: MIT
homepage: https://github.com/Yicheng-Mark/hermes-windows-plugins/tree/main/windows-devices
tags: [windows, diagnostics, devices, drivers]
provides_tools:
  - win_device_table
  - win_device_detail
provides_hooks: []
provides_middleware: []
requires_env: []
requires_hermes: ">=0.21.4"
pip_dependencies: []
