[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-dpapi-secrets"
version = "0.1.0"
description = "Windows DPAPI secret source for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Yicheng-Mark/hermes-dpapi-secrets"
Issues = "https://github.com/Yicheng-Mark/hermes-dpapi-secrets/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_dpapi_secrets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: writes real DPAPI blobs for the current user (set HERMES_DPAPI_LIVE=1)",
]
