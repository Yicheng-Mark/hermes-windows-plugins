name: hermes-windows-apps
version: 0.1.0
manifest_version: 2
description: "Answer 'what is installed on this Windows machine' : the software inventory behind Apps & Features, swept straight from the four Uninstall registry keys (the machine's 64-bit and 32-bit views plus the user's), so a program is found even when the Settings page hides it. Each row carries version, publisher, size in MB, install date and which view it lives in -- the same DisplayName in two views is a 32/64-bit dual install, marked instead of listed twice. Entries the publisher asked to hide (runtime packages, update rollups) are filtered out unless asked for. Details one program with every field its publisher wrote and a reading of the uninstall command (MSI product code, setup executable, script) so the next step is known before anything is run; the install folder is checked against disk. Read-only: registry keys are enumerated and uninstall strings are reported, never run; no network, no file writes, no elevation. Windows only."
author: Yicheng-Mark
kind: general
license: MIT
homepage: https://github.com/Yicheng-Mark/hermes-windows-plugins/tree/main/windows-apps
tags: [windows, diagnostics, installed-software, inventory]
provides_tools:
  - win_app_table
  - win_app_detail
provides_hooks: []
provides_middleware: []
requires_env: []
requires_hermes: ">=0.21.4"
pip_dependencies: []
