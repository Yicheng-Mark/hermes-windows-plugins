[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-windows-eventlog"
version = "0.1.0"
description = "Read-only Windows Event Log crash forensics tools for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Yicheng-Mark/hermes-windows-eventlog"
Issues = "https://github.com/Yicheng-Mark/hermes-windows-eventlog/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_windows_eventlog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
