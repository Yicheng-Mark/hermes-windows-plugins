name: hermes-windows-network
version: 0.1.0
manifest_version: 2
description: "Answer 'is this machine's network healthy, and which adapter is the problem' on Windows: lists every visible network adapter with its state (up, disconnected, disabled, not present), its link speed as a number, its MAC, whether it is virtual (Hyper-V, VPN, virtual switch) or physical, and its driver version and date; details one adapter's IPv4/IPv6 addresses with prefixes and origins (DHCP, manual, self-assigned 169.254.x.x), default gateways, DNS servers, and a plain-word diagnosis -- link-local means DHCP never answered, an address without a gateway cannot leave its subnet, no DNS means names will not resolve. Read-only: the NetAdapter and NetTCPIP cmdlets are queried, nothing is enabled, renewed, reconfigured or released; no network calls of its own, no file writes. Windows only."
author: Yicheng-Mark
kind: general
license: MIT
homepage: https://github.com/Yicheng-Mark/hermes-windows-plugins/tree/main/windows-network
tags: [windows, diagnostics, network, adapters]
provides_tools:
  - win_adapter_table
  - win_adapter_detail
provides_hooks: []
provides_middleware: []
requires_env: []
requires_hermes: ">=0.21.4"
pip_dependencies: []
