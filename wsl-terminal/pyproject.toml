[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-wsl-terminal"
version = "0.1.0"
description = "WSL distro terminal backend for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Yicheng-Mark/hermes-wsl-terminal"
Issues = "https://github.com/Yicheng-Mark/hermes-wsl-terminal/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_wsl_terminal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: needs a real WSL install with at least one distro (set HERMES_WSL_LIVE=1)",
]
